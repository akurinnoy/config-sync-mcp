apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: config-sync-mcp
  labels:
    app: config-sync-mcp
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: config-sync-mcp
                port:
                  number: 8089
  tls: []
